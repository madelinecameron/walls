# walls with its own Postgres. From the repository root:
#
#   cp deploy/example.env deploy/.env   # then fill it in
#   docker compose -f deploy/docker-compose.yml up -d
#
# The server listens on 127.0.0.1:8797. Put a reverse proxy or a tailnet in front of it
# to reach it from other machines, and add that name to WALLS_ALLOWED_HOSTS.

name: walls

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: walls
      POSTGRES_PASSWORD: walls
      POSTGRES_DB: walls
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./vector.sql:/docker-entrypoint-initdb.d/vector.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "walls"]
      interval: 5s
      timeout: 5s
      retries: 12

  walls:
    image: ${WALLS_IMAGE:-ghcr.io/madelinecameron/walls:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8797:8797"
    env_file:
      - path: .env
        required: false
    environment:
      WALLS_DATABASE_URL: postgresql://walls:walls@db:5432/walls
      WALLS_HOST: 0.0.0.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8797/healthz', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
